[project]
name = "awq"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "numpy==1.26.4",
    "torch==2.3.0",
    "triton==2.3.0",
    "transformers==4.43.2",
    "accelerate",
    "datasets>=2.20.0",
    "fsspec>=2024.5.0",
    "huggingface_hub>=0.24.0",
    "pyarrow>=15",
    "lm-eval",
    "auto-gptq",
    "autoawq==0.2.5",
    "sentencepiece",
    "huggingface_hub",
    "tqdm>=4.67.3",
]

[tool.uv.extra-build-dependencies]
autoawq = ["torch==2.3.0"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
triton = [{ index = "pytorch-cu121" }]
