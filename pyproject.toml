[project]
name = "awq"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.3.0",
    "triton==2.3.0",
    "transformers==4.43.0",
    "accelerate",
    "datasets",
    "lm-eval",
    "auto-gptq",
    "sentencepiece",
    "huggingface_hub",
]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
triton = [{ index = "pytorch-cu121" }]